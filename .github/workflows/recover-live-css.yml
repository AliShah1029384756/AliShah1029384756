name: Recover Live Portfolio CSS

on:
  push:
    paths:
      - '.github/workflows/recover-live-css.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch HTML CSS links and mobile navigation
        shell: python
        run: |
          from pathlib import Path

          root = Path('.')
          for p in root.rglob('*.html'):
              if '.git' in p.parts:
                  continue
              s = p.read_text(encoding='utf-8')
              href = '../recovery.css' if 'projects' in p.parts else 'recovery.css'
              if 'recovery.css' not in s:
                  marker = '<link rel="stylesheet" href="styles.css" />'
                  marker_alt = '<link rel="stylesheet" href="../styles.css" />'
                  if marker in s:
                      s = s.replace(marker, marker + f'\n  <link rel="stylesheet" href="{href}" />', 1)
                  elif marker_alt in s:
                      s = s.replace(marker_alt, marker_alt + f'\n  <link rel="stylesheet" href="{href}" />', 1)
              p.write_text(s, encoding='utf-8')

          p = Path('script.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('navLinks.classList.contains("active")', 'navLinks.classList.contains("is-open")')
          s = s.replace('navLinks.classList.toggle("active")', 'navLinks.classList.toggle("is-open")')
          s = s.replace('navLinks.classList.remove("active")', 'navLinks.classList.remove("is-open")')
          s = s.replace('createGlobalPageRail();\n', '')
          p.write_text(s, encoding='utf-8')

      - name: Commit recovery
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' 'projects/*.html' script.js
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "fix: restore portfolio CSS and mobile navigation"
          git push
